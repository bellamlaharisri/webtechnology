<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Processing System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #dbeafe, transparent 35%),
                radial-gradient(circle at bottom right, #ede9fe, transparent 35%),
                #f8fafc;
            color: #172033;
            padding: 40px 20px;
        }

        .wrapper {
            max-width: 1000px;
            margin: auto;
        }

        /* Header */

        .header {
            background: linear-gradient(135deg, #172033, #344767);
            color: white;
            padding: 35px;
            border-radius: 24px 24px 0 0;
            position: relative;
            overflow: hidden;
        }

        .header::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            right: -50px;
            top: -70px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #dbeafe;
            font-size: 15px;
        }

        .badge {
            display: inline-block;
            margin-top: 18px;
            padding: 7px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.12);
            font-size: 13px;
        }

        /* Main Card */

        .card {
            background: white;
            padding: 35px;
            border-radius: 0 0 24px 24px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 22px;
            color: #172033;
        }

        .section-title span {
            color: #6366f1;
        }

        /* Student details */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .full {
            grid-column: span 2;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d8dee9;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
            background: #f8fafc;
        }

        input:focus {
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
        }

        input:valid {
            border-color: #d8dee9;
        }

        /* Marks */

        .marks-section {
            margin-top: 35px;
        }

        .marks-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .mark-card {
            padding: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            transition: 0.3s;
        }

        .mark-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(15,23,42,0.08);
        }

        .subject-number {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #eef2ff;
            color: #4f46e5;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Button */

        .button-area {
            margin-top: 32px;
            display: flex;
            gap: 15px;
        }

        button,
        input[type="submit"] {
            border: none;
            cursor: pointer;
            padding: 14px 25px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
        }

        .submit-btn {
            flex: 1;
            color: white;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            box-shadow: 0 8px 20px rgba(79,70,229,0.25);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(79,70,229,0.35);
        }

        .reset-btn {
            background: #f1f5f9;
            color: #475569;
        }

        .reset-btn:hover {
            background: #e2e8f0;
        }

        /* Information */

        .info {
            margin-top: 25px;
            padding: 15px;
            background: #f8fafc;
            border-left: 4px solid #6366f1;
            border-radius: 8px;
            color: #64748b;
            font-size: 13px;
        }

        /* Responsive */

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .header {
                padding: 25px;
            }

            .header h1 {
                font-size: 24px;
            }

            .card {
                padding: 25px;
            }

            .form-grid,
            .marks-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: span 1;
            }

            .button-area {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="wrapper">

    <div class="header">

        <h1>SIMATS ENGINEERING</h1>

        <p>
            Student Result Processing...
        </p>

        <div class="badge">
            VIEW RESULT
        </div>

    </div>


    <div class="card">

        <h2 class="section-title">
            Student <span>Information</span>
        </h2>

        <form action="StudentResultServlet" method="post">

            <div class="form-grid">

                <div class="field full">

                    <label for="name">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter student's full name"
                        required>

                </div>


                <div class="field">

                    <label for="regno">
                        Register Number
                    </label>

                    <input
                        type="text"
                        id="regno"
                        name="regno"
                        placeholder="Enter register number"
                        required>

                </div>


            </div>


            <div class="marks-section">

                <h2 class="section-title">
                    Subject <span>Marks</span>
                </h2>


                <div class="marks-grid">

                    <div class="mark-card">

                        <div class="subject-number">
                            01
                        </div>

                        <label for="mark1">
                            Subject 1
                        </label>

                        <input
                            type="number"
                            name="mark1"
                            id="subject1"
                            min="0"
                            max="100"
                            placeholder="Enter mark"
                            required>

                    </div>


                    <div class="mark-card">

                        <div class="subject-number">
                            02
                        </div>

                        <label for="subject2">
                            Subject 2
                        </label>

                        <input
                            type="number"
                            name="mark2"
                            id="subject2"
                            min="0"
                            max="100"
                            placeholder="Enter mark"
                            required>

                    </div>


                    <div class="mark-card">

                        <div class="subject-number">
                            03
                        </div>

                        <label for="subject3">
                            Subject 3
                        </label>

                        <input
                            type="number"
                            name="mark3"
                            id="subject3"
                            min="0"
                            max="100"
                            placeholder="Enter mark"
                            required>

                    </div>

                </div>

            </div>


            <div class="info">

                <strong>Note:</strong>
                Enter marks between 0 and 100.
                The submitted information will be processed by the Java Servlet.

            </div>


            <div class="button-area">

                <input
                    type="submit"
                    value="Calculate Result"
                    class="submit-btn">

                <button
                    type="reset"
                    class="reset-btn">
                    Clear Form
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
