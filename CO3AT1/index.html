<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Preview</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at top left, #6c63ff, transparent 35%),
                radial-gradient(circle at bottom right, #00d4ff, transparent 35%),
                linear-gradient(135deg, #141e30, #243b55);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;

            color: #ffffff;
        }

        /* Main container */

        .main-container {
            width: 100%;
            max-width: 850px;

            background: rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.25);

            border-radius: 30px;

            padding: 45px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.4);

            animation: containerAppear 1s ease;
        }

        @keyframes containerAppear {

            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .college-icon {
            width: 90px;
            height: 90px;

            margin: auto;
            margin-bottom: 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #00c6ff, #7b2ff7);

            border-radius: 50%;

            font-size: 45px;

            box-shadow:
                0 0 30px rgba(0, 198, 255, 0.6);

            animation: floatIcon 3s infinite ease-in-out;
        }

        @keyframes floatIcon {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: 42px;
            font-weight: 800;

            background: linear-gradient(
                90deg,
                #00eaff,
                #ffffff,
                #c77dff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #d8e8ff;
        }

        /* Form */

        .form-section {
            background: rgba(255, 255, 255, 0.10);

            padding: 30px;

            border-radius: 22px;

            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .form-title {
            font-size: 25px;
            font-weight: bold;

            margin-bottom: 25px;

            color: #ffffff;
        }

        .input-group {
            margin-bottom: 22px;
        }

        label {
            display: block;

            font-size: 18px;
            font-weight: 600;

            margin-bottom: 8px;

            color: #e9f5ff;
        }

        .input-box {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 16px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 20px;
        }

        input,
        select {

            width: 100%;

            padding: 16px 16px 16px 50px;

            border: 2px solid rgba(255,255,255,0.2);

            border-radius: 14px;

            outline: none;

            font-size: 18px;

            background: rgba(255,255,255,0.12);

            color: white;

            transition: 0.3s;
        }

        select {
            cursor: pointer;
        }

        select option {
            color: #222;
            background: white;
        }

        input::placeholder {
            color: #cbd7e6;
        }

        input:focus,
        select:focus {

            border-color: #00eaff;

            background: rgba(255,255,255,0.18);

            box-shadow:
                0 0 15px rgba(0,234,255,0.25);

            transform: translateY(-2px);
        }

        /* Submit button */

        #submitBtn {

            width: 100%;

            padding: 18px;

            margin-top: 10px;

            border: none;

            border-radius: 14px;

            font-size: 20px;

            font-weight: bold;

            color: white;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #7b2ff7
                );

            box-shadow:
                0 8px 25px rgba(0, 198, 255, 0.3);

            transition: 0.3s;
        }

        #submitBtn:hover {

            transform: translateY(-4px);

            box-shadow:
                0 12px 35px rgba(0, 198, 255, 0.5);
        }

        #submitBtn:active {
            transform: scale(0.98);
        }

        /* Profile */

        #profileContainer {
            margin-top: 35px;
        }

        .profile-card {

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.95),
                    rgba(238,245,255,0.95)
                );

            color: #1b263b;

            border-radius: 25px;

            padding: 30px;

            box-shadow:
                0 20px 45px rgba(0,0,0,0.35);

            animation: profileAppear 0.7s ease;

            border-top: 6px solid #7b2ff7;
        }

        @keyframes profileAppear {

            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .profile-header {

            text-align: center;

            margin-bottom: 25px;
        }

        .profile-avatar {

            width: 95px;
            height: 95px;

            margin: auto;
            margin-bottom: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #7b2ff7
                );

            color: white;

            font-size: 45px;

            box-shadow:
                0 10px 25px rgba(123,47,247,0.35);
        }

        .profile-header h2 {

            font-size: 30px;

            color: #35206f;

            margin-bottom: 5px;
        }

        .profile-header p {

            color: #667085;

            font-size: 16px;
        }

        /* Information grid */

        .profile-info {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }

        .profile-item {

            padding: 18px;

            background: white;

            border-radius: 15px;

            border: 1px solid #e4e8f0;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.06);

            transition: 0.3s;
        }

        .profile-item:hover {

            transform: translateY(-4px);

            box-shadow:
                0 10px 20px rgba(0,0,0,0.1);
        }

        .profile-label {

            font-size: 14px;

            color: #7a8499;

            margin-bottom: 5px;

            font-weight: 600;

            text-transform: uppercase;
        }

        .profile-value {

            font-size: 19px;

            color: #222b45;

            font-weight: 700;

            word-break: break-word;
        }

        /* Success message */

        .success-message {

            margin-top: 20px;

            padding: 15px;

            border-radius: 12px;

            text-align: center;

            background: #e8fff3;

            color: #087443;

            font-size: 17px;

            font-weight: bold;

            border: 1px solid #a8e6c5;
        }

        /* Remove button */

        #removeBtn {

            width: 100%;

            margin-top: 20px;

            padding: 15px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #ff416c,
                    #ff4b2b
                );

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        #removeBtn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(255,65,108,0.35);
        }

        /* Footer */

        .footer {

            text-align: center;

            margin-top: 25px;

            color: #c9d9ee;

            font-size: 14px;
        }

        /* Responsive */

        @media (max-width: 700px) {

            .main-container {
                padding: 25px;
            }

            h1 {
                font-size: 32px;
            }

            .profile-info {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="main-container">


    <!-- HEADER -->

    <div class="header">

        <div class="college-icon">
            🎓
        </div>

        <h1>Student Registration</h1>

        <p class="subtitle">
            DOM-Based Interactive Student Registration Preview
        </p>

    </div>


    <!-- FORM -->

    <div class="form-section">

        <div class="form-title">
            📝 Enter Student Details
        </div>


        <form id="studentForm">


            <!-- NAME -->

            <div class="input-group">

                <label for="name">
                    Student Name
                </label>

                <div class="input-box">

                    <span class="input-icon">👤</span>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                    >

                </div>

            </div>


            <!-- REGISTER NUMBER -->

            <div class="input-group">

                <label for="registerNumber">
                    Register Number
                </label>

                <div class="input-box">

                    <span class="input-icon">🆔</span>

                    <input
                        type="text"
                        id="registerNumber"
                        placeholder="Enter register number"
                    >

                </div>

            </div>


            <!-- DEPARTMENT -->

            <div class="input-group">

                <label for="department">
                    Department
                </label>

                <div class="input-box">

                    <span class="input-icon">🏫</span>

                    <input
                        type="text"
                        id="department"
                        placeholder="Example: Information Technology"
                    >

                </div>

            </div>


            <!-- YEAR -->

            <div class="input-group">

                <label for="year">
                    Year of Study
                </label>

                <div class="input-box">

                    <span class="input-icon">📚</span>

                    <select id="year">

                        <option value="">
                            -- Select Year --
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>

                </div>

            </div>


            <button
                type="submit"
                id="submitBtn"
            >

                ✨ Generate Student Profile

            </button>


        </form>

    </div>


    <!-- DYNAMIC PROFILE -->

    <div id="profileContainer"></div>


    <div class="footer">

        💻 Developed using HTML, CSS, JavaScript & DOM

    </div>


</div>


<script>


    // ==========================================
    // DOM ELEMENT SELECTION
    // ==========================================

    const studentForm =
        document.getElementById("studentForm");

    const profileContainer =
        document.getElementById("profileContainer");


    // ==========================================
    // FORM SUBMIT EVENT
    // ==========================================

    studentForm.addEventListener(
        "submit",
        function(event) {

            // Prevent page reload
            event.preventDefault();


            // ==========================================
            // READ FORM VALUES
            // ==========================================

            const name =
                document
                .getElementById("name")
                .value
                .trim();


            const registerNumber =
                document
                .getElementById("registerNumber")
                .value
                .trim();


            const department =
                document
                .getElementById("department")
                .value
                .trim();


            const year =
                document
                .getElementById("year")
                .value;


            // ==========================================
            // VALIDATION
            // ==========================================

            if (
                name === "" ||
                registerNumber === "" ||
                department === "" ||
                year === ""
            ) {

                alert(
                    "⚠️ Please fill in all student details!"
                );

                return;
            }


            // ==========================================
            // CLEAR OLD PROFILE
            // ==========================================

            profileContainer.textContent = "";


            // ==========================================
            // CREATE PROFILE CARD
            // ==========================================

            const profileCard =
                document.createElement("div");

            profileCard.classList.add(
                "profile-card"
            );


            // ==========================================
            // PROFILE HEADER
            // ==========================================

            const profileHeader =
                document.createElement("div");

            profileHeader.classList.add(
                "profile-header"
            );


            // Create avatar

            const avatar =
                document.createElement("div");

            avatar.classList.add(
                "profile-avatar"
            );

            avatar.textContent = "👨‍🎓";


            // Create heading

            const heading =
                document.createElement("h2");

            heading.textContent =
                "Student Profile";


            // Create subtitle

            const profileSubtitle =
                document.createElement("p");

            profileSubtitle.textContent =
                "Registration Preview";


            profileHeader.appendChild(avatar);

            profileHeader.appendChild(heading);

            profileHeader.appendChild(
                profileSubtitle
            );


            profileCard.appendChild(
                profileHeader
            );


            // ==========================================
            // INFORMATION GRID
            // ==========================================

            const profileInfo =
                document.createElement("div");

            profileInfo.classList.add(
                "profile-info"
            );


            // ==========================================
            // NAME
            // ==========================================

            const nameItem =
                createProfileItem(
                    "👤 Student Name",
                    name
                );


            // ==========================================
            // REGISTER NUMBER
            // ==========================================

            const registerItem =
                createProfileItem(
                    "🆔 Register Number",
                    registerNumber
                );


            // ==========================================
            // DEPARTMENT
            // ==========================================

            const departmentItem =
                createProfileItem(
                    "🏫 Department",
                    department
                );


            // ==========================================
            // YEAR
            // ==========================================

            const yearItem =
                createProfileItem(
                    "📚 Year of Study",
                    year
                );


            // Add items

            profileInfo.appendChild(nameItem);

            profileInfo.appendChild(registerItem);

            profileInfo.appendChild(departmentItem);

            profileInfo.appendChild(yearItem);


            profileCard.appendChild(profileInfo);


            // ==========================================
            // SUCCESS MESSAGE
            // ==========================================

            const successMessage =
                document.createElement("div");

            successMessage.classList.add(
                "success-message"
            );

            successMessage.textContent =
                "✅ Registration Preview Generated Successfully!";


            profileCard.appendChild(
                successMessage
            );


            // ==========================================
            // REMOVE BUTTON
            // ==========================================

            const removeButton =
                document.createElement("button");

            removeButton.id = "removeBtn";

            removeButton.textContent =
                "🗑️ Remove Profile";


            // Remove profile event

            removeButton.addEventListener(
                "click",
                function() {

                    profileContainer.textContent = "";

                }
            );


            profileCard.appendChild(
                removeButton
            );


            // ==========================================
            // DISPLAY PROFILE
            // ==========================================

            profileContainer.appendChild(
                profileCard
            );

        }
    );


    // ==========================================
    // FUNCTION TO CREATE PROFILE ITEM
    // ==========================================

    function createProfileItem(label, value) {

        const item =
            document.createElement("div");

        item.classList.add(
            "profile-item"
        );


        const labelElement =
            document.createElement("div");

        labelElement.classList.add(
            "profile-label"
        );

        labelElement.textContent =
            label;


        const valueElement =
            document.createElement("div");

        valueElement.classList.add(
            "profile-value"
        );

        valueElement.textContent =
            value;


        item.appendChild(labelElement);

        item.appendChild(valueElement);


        return item;
    }


</script>


</body>

</html>
