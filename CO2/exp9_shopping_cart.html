<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exp 9 · Shopping Cart &amp; Billing System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12172b; --surface:#1b2140; --surface-2:#232a4d;
    --accent:#3ddc97; --accent-2:#ffb347; --danger:#ff6b6b;
    --text:#eef1fb; --muted:#9aa3c7; --border:#2f3766;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); padding:36px 16px;}
  .wrap{max-width:1000px; margin:0 auto;}
  h1{font-family:'Space Grotesk',sans-serif; text-align:center; margin-bottom:6px;}
  p.sub{text-align:center; color:var(--muted); margin-bottom:28px; font-size:0.9rem;}

  .layout{display:grid; grid-template-columns:1.4fr 1fr; gap:22px; align-items:start;}

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:22px; box-shadow:0 15px 40px rgba(0,0,0,0.3);
  }
  .product-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .product{
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:16px;
  }
  .product h3{font-family:'Space Grotesk',sans-serif; font-size:0.98rem; margin-bottom:4px;}
  .product .price{color:var(--accent); font-family:'JetBrains Mono',monospace; font-weight:600; margin-bottom:10px;}
  .product button{
    width:100%; padding:8px 0; border:none; border-radius:7px; background:var(--accent);
    color:#0d1420; font-weight:700; cursor:pointer; font-size:0.85rem;
  }

  table{width:100%; border-collapse:collapse; font-size:0.88rem;}
  th, td{padding:9px 8px; text-align:center; border-bottom:1px solid var(--border);}
  th{color:var(--accent-2); font-family:'Space Grotesk',sans-serif; text-transform:uppercase; font-size:0.7rem;}
  td:first-child, th:first-child{text-align:left;}
  .qty-btn{
    width:24px; height:24px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); border-radius:5px; cursor:pointer; font-size:0.85rem;
  }
  .del{background:none; border:none; color:var(--danger); cursor:pointer; font-size:0.85rem;}
  .empty{text-align:center; color:var(--muted); padding:20px; font-size:0.88rem;}

  .bill-row{
    display:flex; justify-content:space-between; padding:8px 0; font-size:0.9rem;
    border-bottom:1px dashed var(--border);
  }
  .bill-row.total{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.15rem;
    color:var(--accent); border-bottom:none; margin-top:6px; padding-top:14px; border-top:1px solid var(--border);
  }
  .discount-note{font-size:0.78rem; color:var(--accent-2); margin-top:10px; text-align:center;}

  @media (max-width:760px){
    .layout{grid-template-columns:1fr;}
    .product-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Shopping Cart &amp; Billing</h1>
  <p class="sub">Add products, adjust quantities, and get an auto-calculated bill with discount and tax</p>

  <div class="layout">
    <div class="panel">
      <div class="product-grid" id="productGrid"></div>
    </div>

    <div class="panel">
      <table>
        <thead><tr><th>Item</th><th>Qty</th><th>Amount</th><th></th></tr></thead>
        <tbody id="cartBody"><tr><td colspan="4" class="empty">Cart is empty</td></tr></tbody>
      </table>

      <div style="margin-top:18px;">
        <div class="bill-row"><span>Subtotal</span><span id="subtotal">₹0.00</span></div>
        <div class="bill-row"><span>Discount</span><span id="discount">− ₹0.00</span></div>
        <div class="bill-row"><span>GST (18%)</span><span id="tax">+ ₹0.00</span></div>
        <div class="bill-row total"><span>Grand Total</span><span id="grandTotal">₹0.00</span></div>
      </div>
      <div class="discount-note">10% discount auto-applied when subtotal exceeds ₹2000</div>
    </div>
  </div>
</div>

<script>
  // Product catalog
  const products = [
    { id: 1, name: 'Wireless Mouse', price: 599 },
    { id: 2, name: 'Mechanical Keyboard', price: 2199 },
    { id: 3, name: 'USB-C Hub', price: 899 },
    { id: 4, name: 'Laptop Stand', price: 749 },
    { id: 5, name: 'Webcam 1080p', price: 1499 },
    { id: 6, name: 'Noise-Cancel Headset', price: 2599 }
  ];

  let cart = []; // array of { id, name, price, qty }

  function renderProducts() {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = products.map(p => `
      <div class="product">
        <h3>${p.name}</h3>
        <div class="price">₹${p.price.toFixed(2)}</div>
        <button onclick="addToCart(${p.id})">Add to Cart</button>
      </div>
    `).join('');
  }

  function addToCart(id) {
    const product = products.find(p => p.id === id);
    const existing = cart.find(item => item.id === id);

    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({ id: product.id, name: product.name, price: product.price, qty: 1 });
    }
    renderCart();
  }

  function changeQty(id, delta) {
    const item = cart.find(i => i.id === id);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) {
      cart = cart.filter(i => i.id !== id);
    }
    renderCart();
  }

  function removeItem(id) {
    cart = cart.filter(i => i.id !== id);
    renderCart();
  }

  function renderCart() {
    const body = document.getElementById('cartBody');

    if (cart.length === 0) {
      body.innerHTML = '<tr><td colspan="4" class="empty">Cart is empty</td></tr>';
    } else {
      body.innerHTML = cart.map(item => `
        <tr>
          <td>${item.name}</td>
          <td>
            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
            &nbsp;${item.qty}&nbsp;
            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
          </td>
          <td>₹${(item.price * item.qty).toFixed(2)}</td>
          <td><button class="del" onclick="removeItem(${item.id})">✕</button></td>
        </tr>
      `).join('');
    }

    calculateBill();
  }

  function calculateBill() {
    const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

    const DISCOUNT_THRESHOLD = 2000;
    const DISCOUNT_RATE = 0.10;
    const TAX_RATE = 0.18;

    const discount = subtotal > DISCOUNT_THRESHOLD ? subtotal * DISCOUNT_RATE : 0;
    const taxableAmount = subtotal - discount;
    const tax = taxableAmount * TAX_RATE;
    const grandTotal = taxableAmount + tax;

    document.getElementById('subtotal').textContent = `₹${subtotal.toFixed(2)}`;
    document.getElementById('discount').textContent = `− ₹${discount.toFixed(2)}`;
    document.getElementById('tax').textContent = `+ ₹${tax.toFixed(2)}`;
    document.getElementById('grandTotal').textContent = `₹${grandTotal.toFixed(2)}`;
  }

  renderProducts();
  renderCart();
</script>
</body>
</html>
