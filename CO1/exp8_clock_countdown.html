<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exp 8: Digital Clock & Examination Countdown Timer</title>
<style>
  body { font-family: 'Courier New', monospace; background: #0f1420; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 40px; }
  .clock-box { text-align: center; margin-bottom: 40px; }
  #clock { font-size: 60px; letter-spacing: 4px; color: #4ade80; }
  #date { font-size: 16px; color: #9ca3af; margin-top: 5px; }

  .countdown-box { background: #1a2233; padding: 25px 40px; border-radius: 12px; text-align: center; }
  .countdown-box h3 { margin-bottom: 15px; color: #f1c40f; }
  .timer { display: flex; gap: 20px; justify-content: center; }
  .timer div { background: #2b3550; padding: 15px 18px; border-radius: 8px; min-width: 70px; }
  .timer span { display: block; font-size: 26px; font-weight: bold; }
  .timer small { color: #9ca3af; font-size: 12px; }
  .setup { margin-top: 15px; }
  .setup input { padding: 6px; border-radius: 5px; border: none; }
  .setup button { padding: 6px 12px; background: #4a90d9; color: #fff; border: none; border-radius: 5px; cursor: pointer; margin-left: 8px; }
</style>
</head>
<body>
<div class="clock-box">
  <div id="clock">00:00:00</div>
  <div id="date"></div>
</div>

<div class="countdown-box">
  <h3>Examination Countdown</h3>
  <div class="timer">
    <div><span id="days">0</span><small>Days</small></div>
    <div><span id="hours">0</span><small>Hours</small></div>
    <div><span id="minutes">0</span><small>Minutes</small></div>
    <div><span id="seconds">0</span><small>Seconds</small></div>
  </div>
  <div class="setup">
    <input type="datetime-local" id="examDateInput">
    <button onclick="setExamDate()">Set Exam Date</button>
  </div>
  <div id="statusMsg" style="margin-top:10px; color:#4ade80;"></div>
</div>

<script>
  // ---- Digital Clock ----
  function updateClock() {
    const now = new Date();
    const pad = n => n.toString().padStart(2, '0');
    document.getElementById('clock').textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById('date').textContent =
      now.toDateString();
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ---- Exam Countdown Timer ----
  let examDate = null;
  let countdownInterval = null;

  function setExamDate() {
    const val = document.getElementById('examDateInput').value;
    if (!val) { alert('Please pick a date and time.'); return; }
    examDate = new Date(val);
    document.getElementById('statusMsg').textContent = 'Exam date set: ' + examDate.toString();
    if (countdownInterval) clearInterval(countdownInterval);
    countdownInterval = setInterval(updateCountdown, 1000);
    updateCountdown();
  }

  function updateCountdown() {
    if (!examDate) return;
    const now = new Date();
    let diff = examDate - now;

    if (diff <= 0) {
      document.getElementById('days').textContent = '0';
      document.getElementById('hours').textContent = '0';
      document.getElementById('minutes').textContent = '0';
      document.getElementById('seconds').textContent = '0';
      document.getElementById('statusMsg').textContent = 'Exam time has arrived!';
      clearInterval(countdownInterval);
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById('days').textContent = days;
    document.getElementById('hours').textContent = hours;
    document.getElementById('minutes').textContent = minutes;
    document.getElementById('seconds').textContent = seconds;
  }
</script>
</body>
</html>
