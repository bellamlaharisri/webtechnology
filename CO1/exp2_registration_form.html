<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exp 2: Student Registration Form with Validation</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f4f8; display: flex; justify-content: center; padding: 30px; }
  form {
    background: #fff; padding: 30px; border-radius: 10px; width: 380px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  h2 { text-align: center; color: #34495e; margin-bottom: 20px; }
  label { display: block; margin-top: 14px; font-weight: bold; font-size: 14px; color: #333; }
  input {
    width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px;
  }
  input.invalid { border-color: #e74c3c; }
  input.valid { border-color: #27ae60; }
  .error { color: #e74c3c; font-size: 12px; min-height: 16px; }
  button {
    margin-top: 20px; width: 100%; padding: 10px; background: #4a90d9; color: #fff;
    border: none; border-radius: 6px; font-size: 15px; cursor: pointer;
  }
  button:hover { background: #3a78bd; }
  #successMsg { text-align:center; color:#27ae60; font-weight:bold; margin-top:10px; display:none; }
</style>
</head>
<body>
<form id="regForm" novalidate>
  <h2>Student Registration</h2>

  <label for="name">Full Name</label>
  <input type="text" id="name">
  <div class="error" id="nameErr"></div>

  <label for="email">Email</label>
  <input type="text" id="email">
  <div class="error" id="emailErr"></div>

  <label for="phone">Phone Number</label>
  <input type="text" id="phone">
  <div class="error" id="phoneErr"></div>

  <label for="rollno">Roll Number (e.g. 21CS045)</label>
  <input type="text" id="rollno">
  <div class="error" id="rollErr"></div>

  <label for="password">Password (min 6 chars, 1 number)</label>
  <input type="password" id="password">
  <div class="error" id="passErr"></div>

  <button type="submit">Register</button>
  <div id="successMsg">Registration Successful ✔</div>
</form>

<script>
  const form = document.getElementById('regForm');

  function showError(inputId, errId, message) {
    const input = document.getElementById(inputId);
    const errBox = document.getElementById(errId);
    if (message) {
      input.classList.add('invalid');
      input.classList.remove('valid');
      errBox.textContent = message;
      return false;
    } else {
      input.classList.remove('invalid');
      input.classList.add('valid');
      errBox.textContent = '';
      return true;
    }
  }

  function validateName() {
    const val = document.getElementById('name').value.trim();
    const regex = /^[A-Za-z\s]{3,40}$/;
    return showError('name', 'nameErr', regex.test(val) ? '' : 'Enter a valid name (letters only, min 3 chars)');
  }

  function validateEmail() {
    const val = document.getElementById('email').value.trim();
    const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return showError('email', 'emailErr', regex.test(val) ? '' : 'Enter a valid email address');
  }

  function validatePhone() {
    const val = document.getElementById('phone').value.trim();
    const regex = /^[6-9]\d{9}$/;
    return showError('phone', 'phoneErr', regex.test(val) ? '' : 'Enter a valid 10-digit phone number');
  }

  function validateRoll() {
    const val = document.getElementById('rollno').value.trim();
    const regex = /^\d{2}[A-Za-z]{2}\d{3}$/;
    return showError('rollno', 'rollErr', regex.test(val) ? '' : 'Format should be like 21CS045');
  }

  function validatePassword() {
    const val = document.getElementById('password').value;
    const regex = /^(?=.*\d).{6,}$/;
    return showError('password', 'passErr', regex.test(val) ? '' : 'Min 6 chars & at least 1 number');
  }

  // Live validation on input
  document.getElementById('name').addEventListener('input', validateName);
  document.getElementById('email').addEventListener('input', validateEmail);
  document.getElementById('phone').addEventListener('input', validatePhone);
  document.getElementById('rollno').addEventListener('input', validateRoll);
  document.getElementById('password').addEventListener('input', validatePassword);

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const validations = [validateName(), validateEmail(), validatePhone(), validateRoll(), validatePassword()];
    const allValid = validations.every(v => v === true);
    const successMsg = document.getElementById('successMsg');
    if (allValid) {
      successMsg.style.display = 'block';
      form.reset();
      document.querySelectorAll('input').forEach(i => i.classList.remove('valid'));
    } else {
      successMsg.style.display = 'none';
    }
  });
</script>
</body>
</html>
